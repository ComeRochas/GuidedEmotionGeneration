# Training Configuration

# Model settings
model:
  emotion_encoder:
    embedding_dim: 512
    num_emotions: 8
    freeze_backbone: true
  
  vae:
    model_id: "runwayml/stable-diffusion-v1-5"
    subfolder: "vae"
  
  unet:
    in_channels: 4
    out_channels: 4
    cross_attention_dim: 512
    use_pretrained: false
    pretrained_model_id: null

# Training settings
training:
  num_epochs: 100
  batch_size: 8
  learning_rate: 1.0e-4
  num_workers: 4
  gradient_accumulation_steps: 1
  mixed_precision: true
  gradient_checkpointing: true
  
  # DDPM settings
  num_train_timesteps: 1000
  beta_schedule: "linear"
  prediction_type: "epsilon"
  
  # Optimizer
  optimizer:
    type: "adamw"
    betas: [0.9, 0.999]
    weight_decay: 0.01
    eps: 1.0e-8
  
  # Learning rate scheduler
  lr_scheduler:
    type: "cosine"
    warmup_steps: 1000

# Data settings
data:
  data_root: "./src/data/celeba/celeba_hq_256"
  image_size: 256
  return_emotion_labels: false

# Checkpoint settings
checkpoint:
  save_dir: "./checkpoints"
  save_every_n_epochs: 5
  keep_last_n_checkpoints: 3

# Logging settings
logging:
  log_dir: "./logs"
  log_every_n_steps: 100
  use_tensorboard: true
  use_wandb: false
  wandb_project: "emotion-guided-diffusion"

# Validation settings
validation:
  val_every_n_epochs: 5
  num_validation_samples: 4
